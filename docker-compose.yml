# ─────────────────────────────────────────────────────────────────────────────
# Modern Blue Collar — ONE compose file for local demo AND production.
#
#   Local free demo (Postgres + MinIO + Mailpit, DEMO_MODE):
#     cp .env.example .env
#     docker compose --profile demo up --build
#
#   Production (external Wasabi + real SMTP; edit .env, omit the profile):
#     docker compose up -d --build
#
# `minio` + `mailpit` are gated behind the "demo" profile, so a plain
# `docker compose up` starts only app + postgres, and the app talks to whatever
# external Wasabi / SMTP you configured in .env.
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: modern-blue-collar:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mbc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbc_demo_password}
      POSTGRES_DB: ${POSTGRES_DB:-mbc}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mbc} -d ${POSTGRES_DB:-mbc}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Local-demo-only services (profile: demo) ────────────────────────────────
  minio:
    image: minio/minio:latest
    profiles: ["demo"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  # Creates the demo buckets once MinIO is reachable, then exits.
  createbuckets:
    image: minio/mc:latest
    profiles: ["demo"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb -p local/${S3_BUCKET:-mbc-uploads};
      mc mb -p local/${WASABI_BUCKET:-mbc-backups};
      echo 'MinIO buckets ready: ${S3_BUCKET:-mbc-uploads}, ${WASABI_BUCKET:-mbc-backups}';
      "

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["demo"]
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
  minio_data:
